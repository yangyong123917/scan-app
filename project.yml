name: ScanLite
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"

schemes:
  ScanLite:
    build:
      targets:
        ScanLite: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  ScanLite:
    type: application
    platform: iOS
    sources:
      - path: ScanLite
        excludes:
          - "Info.plist"
    info:
      path: ScanLite/Info.plist
      properties:
        CFBundleDisplayName: 扫描小工具
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: 需要使用相机拍摄待扫描的文档
        NSPhotoLibraryUsageDescription: 需要访问相册以导入待扫描的图片
        NSPhotoLibraryAddUsageDescription: 需要把扫描结果保存到相册
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scanlite
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_IDENTITY: ""
